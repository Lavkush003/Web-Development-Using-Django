
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        label {
            display: inline-block;
            width: 85px;
            font-size: 18px;
        }

        input {
            width: 210px;
            height: 25px;
            font-size: 16px;
        }

        p {
            margin-bottom: 15px;
        }

        button {
            padding: 5px 12px;
            font-size: 16px;
        }

        .message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Registration</h1>

    {% if message %}
        <p class="message">{{ message }}</p>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Submit</button>

    </form>

</body>
</html>
