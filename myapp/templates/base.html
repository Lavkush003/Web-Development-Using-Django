<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tasty Bites{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe1e4;
            color: #2f2f2f;
        }

        .site-wrap {
            width: min(96vw, 1180px);
            margin: 28px auto;
            background: rgba(255,255,255,0.3);
            padding: 0 0 12px;
        }

        .topbar {
            background: linear-gradient(135deg, #6a0f1b, #4d0d15 35%, #2f0a10 100%);
            color: #f6efe9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px 16px 28px;
            border-radius: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-mark {
            font-size: 1.3rem;
            line-height: 1;
            color: #f8e6db;
        }

        .nav {
            display: flex;
            gap: 28px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .nav a {
            text-decoration: none;
            color: #f5f0ef;
        }

        .hero {
            position: relative;
            min-height: 270px;
            background:
                radial-gradient(circle at 40% 30%, rgba(255, 184, 120, 0.26), transparent 24%),
                radial-gradient(circle at 70% 25%, rgba(255, 112, 58, 0.20), transparent 26%),
                linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0.35)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="%2326090d"/><circle cx="140" cy="180" r="20" fill="%23f6b076" opacity="0.4"/><circle cx="480" cy="220" r="30" fill="%23eb8d52" opacity="0.4"/><circle cx="750" cy="150" r="18" fill="%23f7c49a" opacity="0.5"/><circle cx="1030" cy="200" r="22" fill="%23ee8a4a" opacity="0.45"/><circle cx="1200" cy="180" r="28" fill="%23c66239" opacity="0.4"/><circle cx="350" cy="320" r="18" fill="%23ffb074" opacity="0.5"/><circle cx="900" cy="350" r="26" fill="%23ffb56f" opacity="0.4"/></svg>') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(8, 5, 5, 0.18), rgba(43, 10, 16, 0.28));
        }

        .hero-content {
            position: relative;
            z-index: 1;
            color: #fff;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2.2rem, 3vw, 3.4rem);
            font-weight: 700;
            color: #f5eee9;
            letter-spacing: 0.5px;
        }

        .hero p {
            margin: 8px 0 18px;
            font-size: 1.2rem;
            font-style: italic;
            color: rgba(255,255,255,0.8);
        }

        .cta {
            display: inline-block;
            background: rgba(255, 138, 89, 0.32);
            border: 1px solid rgba(255,255,255,0.32);
            color: #fef4f0;
            font-size: 0.9rem;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
        }

        .menu-shell {
            background: rgba(255,255,255,0.78);
            padding: 22px 18px 0;
            margin-top: 0;
        }

        .menu-title {
            text-align: center;
            font-size: clamp(2rem, 2.6vw, 2.8rem);
            font-weight: 700;
            font-style: italic;
            color: #2c2d2d;
            margin: 0 0 18px;
        }

        .menu-title span {
            font-size: 1.8rem;
            vertical-align: middle;
            margin-left: 8px;
            color: #af5e42;
        }

        .dish-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(150px, 1fr));
            gap: 14px;
            align-items: stretch;
            padding: 0 8px 18px;
        }

        .dish-card {
            background: rgba(255,255,255,0.35);
            border-radius: 12px;
            text-align: center;
            padding: 18px 10px 14px;
            min-height: 260px;
            box-shadow: 0 0 0 1px rgba(148, 140, 140, 0.12);
        }

        .dish-visual {
            width: 120px;
            height: 120px;
            margin: 0 auto 12px;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 0 8px rgba(255,255,255,0.35), 0 10px 18px rgba(0,0,0,0.08);
            background: #f0f0f0;
        }

        .dish-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 50%;
        }

        .dish-card h4 {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.2;
            font-weight: 700;
            min-height: 52px;
            color: #2f2f2f;
        }

        .dish-card p {
            margin: 8px 0 10px;
            font-size: 0.8rem;
            color: #5a5a5a;
            line-height: 1.4;
            min-height: 52px;
        }

        .price {
            font-size: 1rem;
            font-weight: 700;
            color: #b7402a;
        }

        .pizza { background: radial-gradient(circle at 35% 35%, #f7e7a6, #d27c3c 28%, #ad4029 60%, #7a1f1a 100%); }
        .burger { background: radial-gradient(circle at 35% 35%, #dd9e5d, #ac5f33 34%, #68361f 62%, #452311 100%); }
        .pasta { background: radial-gradient(circle at 35% 35%, #f0d980, #e0a45b 25%, #ae5e32 54%, #7a3827 100%); }
        .sandwich { background: radial-gradient(circle at 35% 35%, #f6c75d, #d79942 28%, #af5a2c 58%, #5e2e1f 100%); }
        .cake { background: radial-gradient(circle at 38% 38%, #a5462e, #7a2a24 40%, #54281d 72%, #2d1915 100%); }
        .paneer { background: radial-gradient(circle at 38% 38%, #f4d89d, #dcb056 20%, #b56b2f 44%, #5d2a17 75%, #2a1811 100%); }

        .offer-strip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 22px;
            background: rgba(255,255,255,0.62);
            padding: 16px 18px 18px;
            margin-top: 8px;
        }

        .offer-text {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #2a2a2a;
        }

        .offer-icon {
            font-size: 1.5rem;
            display: inline-flex;
            color: #bf5b2d;
        }

        .offer-text small {
            display: block;
            font-size: 0.78rem;
            color: #4d4d4d;
            font-weight: 500;
            margin-top: 2px;
        }

        .order-btn {
            background: linear-gradient(180deg, #7d2717, #58170d);
            border: none;
            color: white;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .footer {
            background: linear-gradient(180deg, #2a1a16, #110b0c 58%, #201312 100%);
            color: #f2eae5;
            padding: 26px 28px 16px;
            margin-top: 0;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1.4fr;
            gap: 30px;
        }

        .footer h3 {
            margin: 0 0 10px;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .footer p,
        .footer li,
        .footer a {
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 0;
        }

        .footer ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer a {
            text-decoration: none;
        }

        .copyright {
            text-align: center;
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
        }

        .tip {
            background: rgba(255,255,255,0.80);
            color: #4a4a4a;
            font-size: 0.9rem;
            font-style: italic;
            padding: 10px 18px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tip .bulb {
            font-size: 1.2rem;
        }

        @media (max-width: 980px) {
            .dish-grid {
                grid-template-columns: repeat(2, minmax(150px, 1fr));
            }

            .footer-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .topbar {
                flex-direction: column;
                gap: 12px;
            }

            .nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .dish-grid {
                grid-template-columns: 1fr;
            }

            .offer-strip {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrap">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
